---
name: OpenCode
version: dev
slug: opencode
description: AI coding agent with web interface powered by OpenCode
url: https://github.com/timmo001/app-opencode
init: false
ingress: true
ingress_stream: true
panel_icon: mdi:code-braces
ports:
  4096/tcp: 4096
ports_description:
  4096/tcp: OpenCode server
homeassistant: 2025.11.0
arch:
  - aarch64
  - amd64
auth_api: true
map:
  - ssl:ro
options:
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
  server_password: ''
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  ssl: bool
  certfile: str
  keyfile: str
  server_password: str?
  leave_front_door_open: bool?

---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Check
        run: mise run check

      - name: Build
        run: mise run build

  # Checks both architectures build, without pushing.
  image:
    name: Build images
    permissions:
      contents: read
      packages: write
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/build-container-image.yml@de4221cd9b24ad3d61aa1db87b6e4864cf56d5a1 # 20261027.0
    with:
      image: ghcr.io/timmo001/app-opencode
      home-assistant: true
      push: false

  # Runs the image the way the Supervisor does: as root, with /data and /config mounted and
  # options.json written by root with mode 0600.
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t app-opencode:ci .

      - name: Start the app
        run: |
          mkdir data config
          echo '{"remote_access": false, "system_packages": ["tree"], "tools": ["fd", "dust"]}' > data/options.json
          sudo chown -R root:root data config
          sudo chmod 600 data/options.json
          # Ingress only answers the Supervisor, which here is the Docker host.
          # The test container uses OpenCode's built-in model list, so CI makes no calls to OpenCode's servers.
          docker run -d --name app -v "$PWD/data:/data" -v "$PWD/config:/config" \
            -e OPENCODE_APP_INGRESS_FROM=172.17.0.1 \
            -e OPENCODE_DISABLE_MODELS_FETCH=true \
            -p 8099:8099 -p 49374:49374 app-opencode:ci

      - name: Check OpenCode is running
        run: |
          for _ in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8099/api/status | tee status.json | jq -e '.running != null'; then
              jq -e '.warnings == []' status.json
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Check pairing
        run: >-
          curl -sf -X POST -H 'content-type: application/json' -d '{"host":"127.0.0.1"}'
          http://127.0.0.1:8099/api/pair
          | jq -e '(.links[0].url | test("^http://127\\.0\\.0\\.1:49374/auth/connect/.+"))
          and (.qr | startswith("<svg"))'

      - name: Check the options were installed
        run: |
          # System packages install in the background once OpenCode is up.
          for _ in $(seq 1 90); do
            docker exec app tree --version && break
            sleep 2
          done
          docker exec app tree --version
          # fd comes with the image, dust isn't a default so it's downloaded, and eza is a
          # default taken off the list, so it's removed.
          docker exec app fd --version
          docker exec app ha-bridge --version
          docker exec app dust --version
          if docker exec app eza --version; then exit 1; fi
          sudo test -f config/opencode.json
          sudo test -L data/home/.config/opencode/plugins/opencode-app.js

      - name: Check the tools option is kept across a restart
        run: |
          docker restart app
          sleep 5
          sudo test -n "$(sudo find data/home/.local/share/mise/installs -maxdepth 1 -name dust)"

      - name: App logs
        if: always()
        run: docker logs app || true

min_version = "2025.1.0"

[tools]
node = "26.11.1"
bun = "1.4.3"
uv = "0.13.1"
"pypi:yamllint" = "1.38.0"

[tasks.install]
description = "Install dependencies"
run = "bun install"

[tasks.build]
description = "Compile the entrypoint program and the OpenCode plugin into dist"
depends = ["install"]
run = "bun run build"

[tasks.lint]
description = "Lint the TypeScript with Oxlint"
depends = ["install"]
run = "bun run lint"

[tasks.typecheck]
description = "Type check the TypeScript"
depends = ["install"]
run = "bun run typecheck"

[tasks."format:check"]
description = "Check formatting with Prettier"
depends = ["install"]
run = "bun run format:check"

[tasks.format]
description = "Format with Prettier"
depends = ["install"]
run = "bun run format"

[tasks."lint:yaml"]
description = "Lint the YAML with yamllint"
run = "yamllint ."

[tasks."lint:apps"]
description = "Check the manager app's config.yaml matches the app's"
depends = ["install"]
run = "bun scripts/check-apps.ts"

[tasks.check]
description = "Lint, type check and check formatting"
depends = ["lint", "typecheck", "format:check", "lint:yaml", "lint:apps"]

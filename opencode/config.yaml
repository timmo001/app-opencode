---
name: OpenCode
# Set to the release version at release time.
version: 0.2.1
slug: opencode
description: An AI coding agent for your Home Assistant setup, powered by OpenCode
url: https://github.com/timmo001/app-opencode
arch:
  - aarch64
  - amd64
image: ghcr.io/timmo001/app-opencode
# The sidebar page signs you in to OpenCode in a new tab. It only answers the Supervisor.
ingress: true
ingress_port: 8099
panel_icon: mdi:code-braces
panel_title: OpenCode
ports:
  49374/tcp: 49374
ports_description:
  49374/tcp: OpenCode on your network (web UI and API)
watchdog: tcp://[HOST]:[PORT:49374]
# Reaches Home Assistant's MCP server through the Supervisor.
homeassistant_api: true
# The Supervisor's /core endpoints, which ha-bridge reads Core's journal through.
hassio_api: true
hassio_role: homeassistant
map:
  - type: addon_config
    read_only: false
  - type: homeassistant_config
    read_only: false
  - type: share
    read_only: false
# Installed tools come back from mise on the next start, so backups skip them.
backup_exclude:
  - home/.cache
  - home/.local/share/mise
options:
  remote_access: false
  cors_origins: []
  home_assistant_mcp: true
  ha_bridge: true
  system_packages:
    - build-essential
    - dnsutils
    - ffmpeg
    - iputils-ping
    - rsync
    - sqlite3
    - tmux
  tools:
    - actionlint
    - bat
    - deno
    - eza
    - fd
    - fzf
    - go
    - hyperfine
    - just
    - lazygit
    - npm:skills
    - pitchfork
    - pnpm
    - pypi:yamllint
    - python
    - ruff
    - shellcheck
    - shfmt
    - starship
    - uv
    - watchexec
    - yq
    - zoxide
schema:
  server_password: password?
  remote_access: bool
  cors_origins:
    - match(^https?://[^/\s]+$)
  home_assistant_mcp: bool
  music_assistant_token: password?
  ha_bridge: bool
  system_packages:
    - match(^[a-z0-9][a-z0-9+.-]+$)
  tools:
    - match(^(?:[a-z0-9-]+:)?@?[A-Za-z0-9][A-Za-z0-9._/+-]*(?:@[A-Za-z0-9._+-]+)?$)

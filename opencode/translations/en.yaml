---
configuration:
  log_level:
    name: Log level
    description: >-
      Controls the level of log details the app provides.
  server_password:
    name: Server password
    description: >-
      Optional password to protect the OpenCode server. When set,
      HTTP Basic authentication will be required (username: opencode).
  repositories:
    name: Repositories
    description: >-
      List of GitHub repositories to clone on startup. Specify in
      the format "owner/repo" (e.g., "timmo001/system-bridge").
      Repositories are cloned to /data/repos/<repo-name>.
network:
  4096/tcp: OpenCode web interface

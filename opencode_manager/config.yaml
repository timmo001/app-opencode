---
# The same app as ../opencode, with the Supervisor's manager role. Only the keys that
# scripts/check-apps.ts allows may differ; everything else must match ../opencode/config.yaml.
name: OpenCode (manager access)
# Set to the release version at release time, with ../opencode/config.yaml.
version: 0.2.2
slug: opencode_manager
description: >-
  OpenCode with the Supervisor's manager role, so the agent can read every log and manage
  your apps and host
url: https://github.com/timmo001/app-opencode
arch:
  - aarch64
  - amd64
image: ghcr.io/timmo001/app-opencode
# The sidebar page signs you in to OpenCode in a new tab. It only answers the Supervisor.
ingress: true
ingress_port: 8099
panel_icon: mdi:code-braces
panel_title: OpenCode (manager)
# A different host port, so both apps can run at once.
ports:
  49374/tcp: 49375
ports_description:
  49374/tcp: OpenCode on your network (web UI and API)
watchdog: tcp://[HOST]:[PORT:49374]
# Reaches Home Assistant's MCP server through the Supervisor.
homeassistant_api: true
# Every Supervisor log for ha-bridge, and control of apps, the host and backups.
hassio_api: true
hassio_role: manager
map:
  - type: addon_config
    read_only: false
  - type: homeassistant_config
    read_only: false
  - type: share
    read_only: false
# Everything mise installs at runtime is in home/.local/share/mise: the tools option comes back
# on the next start and `mise install` brings back the rest. Caches, dependencies and OpenCode's
# undo snapshots and reference checkouts can be rebuilt too, so backups skip them.
backup_exclude:
  - .venv
  - home/.bun/install/cache
  - home/.bundle/cache
  - home/.cabal/packages
  - home/.cache
  - home/.cargo/git
  - home/.cargo/registry
  - home/.conda/pkgs
  - home/.gem/ruby/*/cache
  - home/.gradle/caches
  - home/.gradle/wrapper/dists
  - home/.hex/packages
  - home/.local/share/aube/store
  - home/.local/share/gem/ruby/*/cache
  - home/.local/share/mise
  - home/.local/share/opencode/repos
  - home/.local/share/opencode/snapshot
  - home/.local/share/pnpm/store
  - home/.m2/repository
  - home/.npm
  - home/.nuget/packages
  - home/.pnpm-store
  - home/.pub-cache/git
  - home/.pub-cache/hosted
  - home/.yarn/berry/cache
  - home/go/pkg
  - node_modules
options:
  remote_access: false
  cors_origins: []
  home_assistant_mcp: true
  ha_bridge: true
  system_packages:
    - build-essential
    - dnsutils
    - ffmpeg
    - iputils-ping
    - rsync
    - sqlite3
    - tmux
  tools:
    - actionlint
    - bat
    - deno
    - eza
    - fd
    - fzf
    - go
    - hyperfine
    - just
    - lazygit
    - npm:skills
    - pitchfork
    - pnpm
    - pypi:yamllint
    - python
    - ruff
    - shellcheck
    - shfmt
    - starship
    - uv
    - watchexec
    - yq
    - zoxide
schema:
  server_password: password?
  remote_access: bool
  cors_origins:
    - match(^https?://[^/\s]+$)
  home_assistant_mcp: bool
  music_assistant_token: password?
  ha_bridge: bool
  system_packages:
    - match(^[a-z0-9][a-z0-9+.-]+$)
  tools:
    - match(^(?:[a-z0-9-]+:)?@?[A-Za-z0-9][A-Za-z0-9._/+-]*(?:@[A-Za-z0-9._+-]+)?$)

---
name: OpenCode
# Set to the release version at release time.
version: dev
slug: opencode
description: An AI coding agent for your Home Assistant setup, powered by OpenCode
url: https://github.com/timmo001/app-opencode
arch:
  - aarch64
  - amd64
image: ghcr.io/timmo001/app-opencode
# The sidebar page signs you in to OpenCode in a new tab. It only answers the Supervisor.
ingress: true
ingress_port: 8099
panel_icon: mdi:code-braces
panel_title: OpenCode
ports:
  49374/tcp: 49374
ports_description:
  49374/tcp: OpenCode on your network (web UI and API)
watchdog: tcp://[HOST]:[PORT:49374]
map:
  - type: addon_config
  - type: homeassistant_config
  - type: share
# Installed tools come back from mise on the next start, so backups skip them.
backup_exclude:
  - home/.cache
  - home/.local/share/mise
options:
  remote_access: false
  system_packages: []
  tools:
    - python
    - uv
    - pnpm
    - fd
    - yq
    - shellcheck
schema:
  server_password: password?
  remote_access: bool
  system_packages:
    - match(^[a-z0-9][a-z0-9+.-]+$)
  tools:
    - match(^(?:[a-z0-9-]+:)?@?[A-Za-z0-9][A-Za-z0-9._/+-]*(?:@[A-Za-z0-9._+-]+)?$)

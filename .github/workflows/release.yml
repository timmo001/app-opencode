---
name: Release

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Read version
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The Supervisor pulls the image tag that matches config.yaml, so they must agree. Both apps
      # use the same image.
      - name: Check the tag matches the app version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          for config in opencode/config.yaml opencode_manager/config.yaml; do
            app_version="$(yq -r '.version' "$config")"
            if [ "$version" != "$app_version" ]; then
              echo "::error title=Version mismatch::$config has $app_version, the tag is $TAG."
              exit 1
            fi
          done
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  image:
    name: Image
    needs: version
    permissions:
      contents: read
      packages: write
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/build-container-image.yml@996dd60d03b12f28b482074a9eed7083a18e2439 # 20261013.1
    with:
      image: ghcr.io/timmo001/app-opencode
      version: ${{ needs.version.outputs.version }}
      home-assistant: true

  changelog:
    name: Changelog
    needs: image
    permissions:
      contents: read
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/home-assistant-app-changelog.yml@996dd60d03b12f28b482074a9eed7083a18e2439 # 20261013.1
    with:
      changelog-path: opencode/CHANGELOG.md
    secrets:
      token: ${{ secrets.RELEASE_COMMIT_TOKEN }}

  # Asks timmo001/home-assistant-apps to copy this release's app folder, now
  # its image is pushed.
  home-assistant-apps:
    name: Home Assistant apps repository
    needs: image
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/home-assistant-app-dispatch.yml@996dd60d03b12f28b482074a9eed7083a18e2439 # 20261013.1
    with:
      repository: timmo001/home-assistant-apps
    secrets:
      token: ${{ secrets.RELEASE_COMMIT_TOKEN }}

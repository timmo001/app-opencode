---
name: OpenCode
version: dev
slug: opencode
description: AI coding agent with web interface powered by OpenCode
url: https://github.com/anomalyco/opencode
init: false
ingress: true
ingress_stream: true
panel_icon: mdi:robot
homeassistant: 2025.11.0
arch:
  - aarch64
  - amd64
hassio_api: true
hassio_role: manager
homeassistant_api: true
auth_api: true
host_network: true
docker_api: true
journald: true
host_dbus: true
uart: true
usb: true
gpio: true
audio: true
apparmor: false
privileged:
  - NET_ADMIN
  - SYS_ADMIN
  - SYS_RAWIO
  - SYS_TIME
  - SYS_NICE
devices:
  - /dev/mem
ports:
  4096/tcp: 4096
ports_description:
  4096/tcp: OpenCode web interface
map:
  - addons:rw
  - all_addon_configs:rw
  - backup:rw
  - homeassistant_config:rw
  - media:rw
  - share:rw
  - ssl:rw
options:
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
  server_password: ""
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  ssl: bool
  certfile: str
  keyfile: str
  server_password: str?
  leave_front_door_open: bool?
